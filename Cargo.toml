[workspace]
resolver = "2"
members = ["crates/ferret-core", "crates/ferret", "crates/ferret-app", "crates/ferret-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nimiology/ferret"
homepage = "https://github.com/nimiology/ferret"

[profile.release]
debug = 1

# The config for 'dist'
[profile.dist]
inherits = "release"
lto = "thin"
