[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "homebrew"]
# TODO: GitHub owner unknown. Create OWNER/homebrew-ferret and set HOMEBREW_TAP_TOKEN in repo secrets.
tap = "OWNER/homebrew-ferret"
publish-jobs = ["homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
install-path = "CARGO_HOME"
install-updater = false
