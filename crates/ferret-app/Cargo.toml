[package]
name = "ferret-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ferret menu bar app"
publish = false

# Shipped as a .dmg by the dmg job in release.yml, not as a Homebrew formula.
[package.metadata.dist]
dist = false

[[bin]]
name = "ferret"
path = "src/main.rs"

# `cargo build --release -p ferret-app`, then from this directory: `cargo packager --release`
# (CI builds a universal binary first; see .github/workflows/build-dmg.yml).
# Icons: `cargo run -p ferret-app --example make_icons` + iconutil (see examples/make_icons.rs).
[package.metadata.packager]
product-name = "Ferret"
identifier = "com.ferret.app"
category = "Utility"
formats = ["app", "dmg"]
icons = ["assets/AppIcon.icns"]
out-dir = "../../target/packager"
binaries-dir = "../../target/release"
binaries = [{ path = "ferret", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "assets/Info.plist" # merged into the generated plist: LSUIElement

[dependencies]
ferret-core = { path = "../ferret-core" }
eframe = "0.29"
anyhow = "1"
libc = "0.2"
tray-icon = "0.26.1"
global-hotkey = "0.9.0"
toml = "1.1.8"
toml_edit = "0.25"
tiny-skia = "0.12.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSResponder"] }
