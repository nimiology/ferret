[package]
name = "ferret-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ferret's index, scanner, query engine, snapshot and socket protocol"
publish = false

[dependencies]
libc = "0.2.150"
rayon = "1.10"
memchr = "2.7"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
unicode-normalization = "0.1"
thiserror = "1"
globset = "0.4"
ignore = "0.4"
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "search"
harness = false
