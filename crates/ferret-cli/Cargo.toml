[package]
name = "ferret-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ff"
path = "src/main.rs"

[dependencies]
ferret-core = { path = "../ferret-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.29"
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "FSEvents"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
ferret-mcp = { version = "0.1.0", path = "../ferret-mcp" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
